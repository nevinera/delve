name: Go

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: game-server/go.mod

      - run: go test ./...
        working-directory: game-server

  vet:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: game-server/go.mod

      - run: go vet ./...
        working-directory: game-server

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: game-server/go.mod

      - run: test -z "$(gofmt -l .)"
        working-directory: game-server

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: game-server/go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: game-server
