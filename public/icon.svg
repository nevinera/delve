<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="32" fill="#1a1a1a"/>

  <g transform="translate(32,32) scale(0.72) translate(-32,-32)">
    <!-- Haft -->
    <rect x="29" y="6" width="6" height="52" rx="2" fill="#8f8f8f"/>
    <circle cx="32" cy="58" r="4" fill="#8f8f8f"/>

    <!-- Axe head: right blade -->
    <path d="M32,10 L54,4 Q62,17 54,30 L32,26 Z" fill="#f0f0f0"/>
    <!-- Axe head: left blade (mirrored) -->
