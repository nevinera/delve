<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delve Ability Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: monospace;
      background: #1a1a1a;
      color: #ddd;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-area {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    #ability-icon {
      display: none;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background: #111;
      border: 2px solid #668;
      border-radius: 6px;
      object-fit: cover;
      cursor: pointer;
    }
    #ability-icon:hover { border-color: #9ac; }
    #ability-icon.disabled { cursor: default; opacity: 0.5; border-color: #444; }

    #controls {
      width: 420px;
      flex-shrink: 0;
      background: #2a2a2a;
      border-left: 1px solid #444;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #controls h2 { font-size: 14px; color: #ccc; }

    #controls label { font-size: 12px; color: #aaa; display: block; margin-bottom: 3px; }

    #controls input[type=text], #controls textarea {
      width: 100%;
      background: #111;
      border: 1px solid #555;
      color: #eee;
      padding: 5px 6px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 3px;
    }

    #power-json { height: 260px; resize: vertical; }

    .field { display: flex; flex-direction: column; }

    .row { display: flex; gap: 10px; }
    .row > .field { flex: 1; }

    button {
      background: #446;
      border: 1px solid #668;
      color: #cce;
      padding: 6px 12px;
      font-family: monospace;
      font-size: 13px;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #558; }
    button:disabled { background: #333; color: #666; cursor: default; border-color: #444; }

    #load-error { color: #e57373; font-size: 12px; white-space: pre-wrap; }

    #power-summary { font-size: 12px; color: #bbb; line-height: 1.5; }
    #power-summary .name { color: #eee; font-weight: bold; font-size: 14px; }

    #range-row { display: flex; align-items: center; gap: 10px; }
    #range-row input[type=range] { flex: 1; }
    #range-label { width: 60px; text-align: right; font-size: 12px; color: #aaa; }

    #use-btn { font-size: 15px; padding: 10px; }

    #log {
      flex: 1;
      min-height: 100px;
      background: #111;
      border: 1px solid #444;
      border-radius: 3px;
      padding: 6px 8px;
      font-size: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
    }
    #log div { color: #999; padding: 1px 0; }
    #log div.error { color: #e57373; }
  </style>
</head>
<body>

<div id="canvas-area">
  <img id="ability-icon" alt="ability icon" title="Use Power (space)">
</div>

<div id="controls">
  <h2>Tokens</h2>
  <div class="row">
    <div class="field">
      <label>Character token URL</label>
      <input type="text" id="char-token-url" value="http://localhost:8001/character-tokens/male-elf-guard.webp">
    </div>
    <div class="field">
      <label>Target token URL</label>
      <input type="text" id="target-token-url" value="http://localhost:8001/unit_types/tokens/goblin-1.webp">
    </div>
  </div>
  <button id="apply-tokens-btn">Apply Tokens</button>

  <h2>Power</h2>
  <div class="field">
    <label>Asset base URL (relative sourceURLs resolve against this)</label>
    <input type="text" id="asset-base-url" value="http://localhost:8001/classes/powers/punch.json">
  </div>
  <div class="field">
    <label>Power JSON (see docs/schema/power.md)</label>
    <textarea id="power-json" spellcheck="false"></textarea>
  </div>
  <div class="row">
    <button id="fetch-btn">Fetch Power</button>
    <button id="load-btn">Load Power</button>
  </div>
  <div id="load-error"></div>
  <div id="power-summary"></div>

  <h2>Target Distance</h2>
  <div id="range-row">
    <input type="range" id="range-slider" min="0" max="10" step="0.5" value="5">
    <div id="range-label">5.0 ft</div>
  </div>

  <button id="use-btn" disabled>Use Power</button>

  <h2>Log</h2>
  <div id="log"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js'

const DEG_TO_RAD = Math.PI / 180
const DEFAULT_MAX_RANGE = 10 // fallback slider max for melee/self-only powers (no maxRange)

const canvasArea      = document.getElementById('canvas-area')
const charTokenInput  = document.getElementById('char-token-url')
const targetTokenInput = document.getElementById('target-token-url')
const applyTokensBtn  = document.getElementById('apply-tokens-btn')
const assetBaseInput  = document.getElementById('asset-base-url')
const powerJsonInput  = document.getElementById('power-json')
const fetchBtn         = document.getElementById('fetch-btn')
const loadBtn         = document.getElementById('load-btn')
const loadError       = document.getElementById('load-error')
const powerSummary    = document.getElementById('power-summary')
const rangeSlider     = document.getElementById('range-slider')
const rangeLabel      = document.getElementById('range-label')
const useBtn          = document.getElementById('use-btn')
const abilityIcon     = document.getElementById('ability-icon')
const log             = document.getElementById('log')

powerJsonInput.value = JSON.stringify({
  name: "Punch",
  castTime: null,
  globalCooldown: 0.5,
  graphicEffects: [
    {
      sourceURL: "../graphics/swing-line.sprites3x3.png",
      duration: 0.6,
      from: "self",
      to: "affected",
      when: "impact",
      condition: "onHit",
      spriteColumns: 3,
      spriteRows: 3
    }
  ],
  soundEffects: [
    {
      sourceURL: "../sounds/punch.ogg",
      duration: 0.12,
      location: "affected",
      when: "impact",
      condition: "onHit",
      volumeScale: 0.5
    }
  ],
  effects: [
    {
      type: "harm",
      affects: "bTarget",
      amount: [89.0, 140.0],
      range: 5.0,
      tags: ["physical", "melee"]
    }
  ]
}, null, 2)

function logMsg(text, isError = false) {
  const div = document.createElement('div')
  if (isError) div.className = 'error'
  const time = new Date().toLocaleTimeString()
  div.textContent = `[${time}] ${text}`
  log.prepend(div)
}

// --- scene setup (static — no map, just a ground plane and two tokens) ---

const canvas = document.createElement('canvas')
canvasArea.appendChild(canvas)

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
renderer.setPixelRatio(window.devicePixelRatio)

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x14181c)

scene.add(new THREE.AmbientLight(0xffffff, 0.7))
const sun = new THREE.DirectionalLight(0xffffff, 1.4)
sun.position.set(5, 10, 5)
scene.add(sun)

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshLambertMaterial({ color: 0x4d6b4d })
)
ground.rotation.x = -Math.PI / 2
scene.add(ground)

const grid = new THREE.GridHelper(200, 40, 0x8a8a8a, 0x5a5a5a)
scene.add(grid)

const camera = new THREE.PerspectiveCamera(40, 4 / 3, 0.1, 1000)

function fitRenderer() {
  const aspect = 4 / 3
  const aw = canvasArea.clientWidth, ah = canvasArea.clientHeight
  const w = aw / ah > aspect ? Math.round(ah * aspect) : aw
  const h = aw / ah > aspect ? ah : Math.round(aw / aspect)
  renderer.setSize(w, h)
  camera.aspect = aspect
  camera.updateProjectionMatrix()
}
window.addEventListener('resize', fitRenderer)
fitRenderer()

// --- token construction (ported from tools/demo.html) ---

function addFacingArrow(group, radius, color) {
  const hw = (0.3 * radius) / Math.sqrt(3)
  const y  = 0.31
  const verts = [
     0,   y,       -1.4 * radius,
    -hw,  y,       -1.1 * radius,
     hw,  y,       -1.1 * radius,
  ]
  const fillGeo = new THREE.BufferGeometry()
  fillGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3))
  fillGeo.setIndex([0, 1, 2])
  fillGeo.computeVertexNormals()
  group.add(new THREE.Mesh(fillGeo, new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide })))

  const borderVerts = verts.map((v, i) => i % 3 === 1 ? v + 0.005 : v)
  const borderGeo = new THREE.BufferGeometry()
  borderGeo.setAttribute('position', new THREE.Float32BufferAttribute(borderVerts, 3))
  group.add(new THREE.LineLoop(borderGeo, new THREE.LineBasicMaterial({ color: 0x000000 })))
}

function createToken(radius, bodyColor, arrowColor, tokenUrl) {
  const group = new THREE.Group()

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, 0.3, 32),
    new THREE.MeshLambertMaterial({ color: bodyColor })
  )
  body.position.y = 0.15
  group.add(body)

  const portraitMat = new THREE.MeshLambertMaterial({ color: 0xffffff })
  const portrait = new THREE.Mesh(new THREE.CircleGeometry(radius * 0.8, 32), portraitMat)
  portrait.rotation.x = -Math.PI / 2
  portrait.position.y = 0.31
  group.add(portrait)

  group._portraitMat = portraitMat
  if (tokenUrl) loadTokenTexture(group, tokenUrl)

  addFacingArrow(group, radius, arrowColor)
  return group
}

function loadTokenTexture(group, url) {
  new THREE.TextureLoader().load(url, texture => {
    group._portraitMat.map = texture
    group._portraitMat.needsUpdate = true
  }, undefined, () => logMsg(`Failed to load token image: ${url}`, true))
}

const charToken = createToken(2.2, 0x2e7d32, 0x81c784, charTokenInput.value.trim())
charToken.position.set(0, 0, 0)
charToken.rotation.y = 0 // faces -Z
scene.add(charToken)

const targetToken = createToken(2.0, 0xc62828, 0xef9a9a, targetTokenInput.value.trim())
targetToken.rotation.y = Math.PI // faces +Z, toward the character
scene.add(targetToken)

applyTokensBtn.addEventListener('click', () => {
  loadTokenTexture(charToken, charTokenInput.value.trim())
  loadTokenTexture(targetToken, targetTokenInput.value.trim())
  logMsg('Token images updated.')
})

// --- target distance ---

function positionTarget(distanceFt) {
  targetToken.position.set(0, 0, -distanceFt)
}
positionTarget(parseFloat(rangeSlider.value))

// --- camera orbit (drag to rotate around the character token) ---
// Radius/pitch mirror tools/demo.html's CAM_BACK/CAM_HEIGHT/pitch clamp.

const CAM_BACK   = 45 * 0.7
const CAM_HEIGHT = 50 * 0.7
const CAM_RADIUS = Math.sqrt(CAM_BACK * CAM_BACK + CAM_HEIGHT * CAM_HEIGHT)
const PITCH_MIN  = 20 * DEG_TO_RAD
const PITCH_MAX  = 60 * DEG_TO_RAD

// azimuth starts off-axis (not directly behind the character) so range changes
// - which move the target straight along -Z - are visible as screen-space
// separation instead of pure depth/foreshortening.
const orbit = { azimuth: Math.PI / 4, pitch: Math.atan2(CAM_HEIGHT, CAM_BACK) }

function positionCamera(distanceFt) {
  const radius = CAM_RADIUS + distanceFt * 0.6
  const horiz = radius * Math.cos(orbit.pitch)
  const height = radius * Math.sin(orbit.pitch)
  camera.position.set(
    Math.sin(orbit.azimuth) * horiz,
    height,
    Math.cos(orbit.azimuth) * horiz
  )
  camera.lookAt(0, 1.5, 0)
}
positionCamera(parseFloat(rangeSlider.value))

rangeSlider.addEventListener('input', () => {
  const d = parseFloat(rangeSlider.value)
  rangeLabel.textContent = `${d.toFixed(1)} ft`
  positionTarget(d)
  positionCamera(d)
})

canvas.addEventListener('contextmenu', e => e.preventDefault())

let dragLastX = null, dragLastY = null
canvas.addEventListener('mousedown', e => { dragLastX = e.clientX; dragLastY = e.clientY })
window.addEventListener('mousemove', e => {
  if (dragLastX === null) return
  orbit.azimuth -= (e.clientX - dragLastX) * 0.008
  orbit.pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, orbit.pitch + (e.clientY - dragLastY) * 0.008))
  dragLastX = e.clientX; dragLastY = e.clientY
  positionCamera(parseFloat(rangeSlider.value))
})
window.addEventListener('mouseup', () => { dragLastX = null; dragLastY = null })

// --- power loading ---

let power = null
let assetBaseUrl = null

const REQUIRED_FIELDS = ['name', 'castTime', 'globalCooldown', 'effects']

// power.maxRange is often omitted for melee powers - fall back to the largest
// `range` (rangeFloat: a number, or a [min, max] pair) found across its effects.
function maxEffectRange(effects) {
  const ranges = (effects || [])
    .map(e => e.range)
    .filter(r => r != null)
    .map(r => Array.isArray(r) ? r[1] : r)
  return ranges.length ? Math.max(...ranges) : null
}

fetchBtn.addEventListener('click', fetchPower)
loadBtn.addEventListener('click', loadPower)

async function fetchPower() {
  const url = assetBaseInput.value.trim()
  if (!url) return
  loadError.textContent = ''
  fetchBtn.textContent = 'Fetching…'
  fetchBtn.disabled = true
  try {
    const res = await fetch(url)
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const json = await res.json()
    powerJsonInput.value = JSON.stringify(json, null, 2)
    logMsg(`Fetched power JSON from ${url}.`)
  } catch (e) {
    loadError.textContent = `Failed to fetch power JSON: ${e.message}`
  } finally {
    fetchBtn.textContent = 'Fetch Power'
    fetchBtn.disabled = false
  }
}

function loadPower() {
  loadError.textContent = ''
  let parsed
  try {
    parsed = JSON.parse(powerJsonInput.value)
  } catch (e) {
    loadError.textContent = `Invalid JSON: ${e.message}`
    return
  }
  const missing = REQUIRED_FIELDS.filter(f => !(f in parsed))
  if (missing.length) {
    loadError.textContent = `Missing required field(s): ${missing.join(', ')}`
    return
  }

  power = parsed
  try {
    assetBaseUrl = new URL('.', assetBaseInput.value.trim()).href
  } catch {
    assetBaseUrl = null
  }

  const maxRange = power.maxRange ?? maxEffectRange(power.effects) ?? DEFAULT_MAX_RANGE
  rangeSlider.max = String(maxRange)
  rangeSlider.value = String(maxRange)
  rangeLabel.textContent = `${maxRange.toFixed(1)} ft`
  positionTarget(parseFloat(rangeSlider.value))
  positionCamera(parseFloat(rangeSlider.value))

  renderSummary()
  useBtn.disabled = false
  updateAbilityIcon()
  logMsg(`Loaded power "${power.name}".`)
}

function renderSummary() {
  const parts = [`<div class="name">${escapeHtml(power.name)}</div>`]
  if (power.description) parts.push(escapeHtml(power.description))
  const meta = []
  meta.push(`castTime: ${power.castTime ?? 'instant'}`)
  meta.push(`GCD: ${power.globalCooldown}s`)
  if (power.cooldown) meta.push(`cooldown: ${power.cooldown}s`)
  if (power.maxRange != null) meta.push(`maxRange: ${power.maxRange}ft`)
  if (power.speed) meta.push(`speed: ${power.speed}ft/s`)
  if (power.frontal === false) meta.push('frontal: no')
  if (power.costType) meta.push(`cost: ${power.costAmount ?? '?'} ${power.costType}`)
  parts.push(meta.join(' &middot; '))
  parts.push(`effects: ${(power.effects || []).map(e => e.type).join(', ') || '(none)'}`)
  powerSummary.innerHTML = parts.join('<br>')
}

function updateAbilityIcon() {
  if (power.iconURL) {
    abilityIcon.src = resolveEffectUrl(power.iconURL)
    abilityIcon.style.display = 'block'
  } else {
    abilityIcon.removeAttribute('src')
    abilityIcon.style.display = 'none'
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

// --- casting / effect playback ---
// Loosely mirrors the real client's App.jsx#handleUsePower + SceneManager#playGraphicEffects,
// with tool-only extensions (not part of docs/schema/power.md or the real client yet):
// - a top-level `speed` field (feet/sec) for projectile powers. When present, travel time
//   is computed from the current target distance, `when: "impact"` effects are delayed
//   until arrival, and a traveling (from!==to) `when: "immediate"` effect's own `duration`
//   is overridden so its flight matches that same arrival time. Without `speed`, everything
//   fires together immediately, same as before.
// - `impactTiming` on a `when: "impact"` soundEffect (see scheduleImpactSound below).
// Condition (onHit/onMiss) is still ignored - hit/miss resolution is server-authoritative.

const activeEffects = []

function useAbility() {
  if (!power || useBtn.disabled) return
  useBtn.disabled = true
  abilityIcon.classList.add('disabled')

  const castTime = power.castTime
  if (castTime) {
    logMsg(`Casting "${power.name}" (${castTime}s)...`)
    setTimeout(() => resolvePower(), castTime * 1000)
  } else {
    resolvePower()
  }
}

useBtn.addEventListener('click', useAbility)
abilityIcon.addEventListener('click', useAbility)
window.addEventListener('keydown', e => {
  if (e.code !== 'Space') return
  const tag = document.activeElement?.tagName
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return
  e.preventDefault()
  useAbility()
})

function resolvePower() {
  logMsg(`"${power.name}" fired!`)

  const distanceFt = parseFloat(rangeSlider.value)
  const travelMs = power.speed ? (distanceFt / power.speed) * 1000 : 0

  const graphicEffects = power.graphicEffects || []
  const soundEffects = power.soundEffects || []
  const immediateGraphics = graphicEffects.filter(e => e.when !== 'impact')
  const impactGraphics = graphicEffects.filter(e => e.when === 'impact')
  const immediateSounds = soundEffects.filter(e => e.when !== 'impact')
  const impactSounds = soundEffects.filter(e => e.when === 'impact')

  playGraphicEffects(immediateGraphics, travelMs)
  playSoundEffects(immediateSounds)
  impactSounds.forEach(effect => scheduleImpactSound(effect, travelMs))

  const fireImpact = () => {
    logMsg(`"${power.name}" impact!`)
    playGraphicEffects(impactGraphics)
  }
  if (impactGraphics.length) {
    if (travelMs > 0) {
      logMsg(`"${power.name}" travelling (${(travelMs / 1000).toFixed(2)}s)...`)
      setTimeout(fireImpact, travelMs)
    } else {
      fireImpact()
    }
  } else if (impactSounds.length && travelMs > 0) {
    logMsg(`"${power.name}" travelling (${(travelMs / 1000).toFixed(2)}s)...`)
  }

  // Cooldown/globalCooldown are ignored here - this tool is for previewing
  // effects repeatedly, not for testing pacing.
  useBtn.disabled = false
  abilityIcon.classList.remove('disabled')
}

function resolveEffectUrl(sourceURL) {
  if (!assetBaseUrl) return sourceURL
  try {
    return new URL(sourceURL, assetBaseUrl).href
  } catch {
    return sourceURL
  }
}

// travelOverrideMs: when the power has a `speed`, this is the computed
// distance/speed travel time - it overrides a traveling effect's own
// `duration` so its visual flight matches when it's actually due to arrive.
function playGraphicEffects(effects, travelOverrideMs = 0) {
  const positions = { self: charToken.position, affected: targetToken.position }
  for (const effect of effects) {
    const fromPos = positions[effect.from] ?? positions.self
    const toPos   = positions[effect.to]   ?? fromPos
    const url = resolveEffectUrl(effect.sourceURL)
    spawnGraphicEffect(url, effect, fromPos, toPos, travelOverrideMs)
  }
}

// Facing convention shared with tokens: angle 0 = -Z ("north"); rotation.y = -angle.
function facingToward(x1, z1, x2, z2) {
  return Math.atan2(x2 - x1, -(z2 - z1))
}

const EFFECT_HEIGHT = 0.4 // just above the tokens' top surface (y ~0.31)

const DEFAULT_SPRITE_FRAME_RATE = 8 // fps, used when spriteFrameRate is omitted

// Sprite-sheet support is a tool-only extension (not part of docs/schema/graphic_effect.md
// or the real client yet) - recognized via optional spriteColumns/spriteRows/spriteFrameCount/
// spriteFrameRate fields on a graphicEffect. spriteFrameCount defaults to columns*rows.
// Playback runs at spriteFrameRate (fps, independent of `duration`) and loops for as long as
// the effect is alive.
function spawnGraphicEffect(url, effect, fromPos, toPos, travelOverrideMs = 0) {
  const { duration, color, scale = 1.0, opacity = 1.0, spriteColumns, spriteRows } = effect
  const isSpriteSheet = spriteColumns > 0 && spriteRows > 0
  const frameCount = effect.spriteFrameCount ?? (spriteColumns * spriteRows)
  const frameRate = effect.spriteFrameRate ?? DEFAULT_SPRITE_FRAME_RATE

  new THREE.TextureLoader().load(url, texture => {
    if (isSpriteSheet) {
      texture.magFilter = THREE.NearestFilter
      texture.generateMipmaps = false
      texture.repeat.set(1 / spriteColumns, 1 / spriteRows)
      texture.offset.set(0, 1 - 1 / spriteRows)
    }

    const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, opacity })
    if (color) mat.color.set(`#${color.replace(/^#/, '')}`)

    const plane = new THREE.Mesh(new THREE.PlaneGeometry(4 * scale, 4 * scale), mat)
    plane.rotation.x = -Math.PI / 2 // lie flat, image "up" faces -Z before the group rotates it

    const traveling = fromPos.x !== toPos.x || fromPos.z !== toPos.z
    const angle = traveling ? facingToward(fromPos.x, fromPos.z, toPos.x, toPos.z) : 0

    const group = new THREE.Group()
    group.add(plane)
    group.rotation.y = -angle
    group.position.set(fromPos.x, EFFECT_HEIGHT, fromPos.z)
    scene.add(group)

    const durationMs = (traveling && travelOverrideMs > 0) ? travelOverrideMs : duration * 1000
    activeEffects.push({
      group, mat, texture, opacity,
      startedAt: performance.now(),
      durationMs,
      fadeStartMs: durationMs * 0.6,
      fromX: fromPos.x, fromZ: fromPos.z, toX: toPos.x, toZ: toPos.z,
      isSpriteSheet, spriteColumns, spriteRows, frameCount, frameRate,
    })
  }, undefined, () => logMsg(`Failed to load graphic effect: ${url}`, true))
}

function updateGraphicEffects(now) {
  for (let i = activeEffects.length - 1; i >= 0; i--) {
    const e = activeEffects[i]
    const elapsed = now - e.startedAt
    if (elapsed >= e.durationMs) {
      scene.remove(e.group)
      e.mat.dispose()
      e.texture.dispose()
      activeEffects.splice(i, 1)
      continue
    }
    const t = elapsed / e.durationMs
    e.group.position.x = e.fromX + (e.toX - e.fromX) * t
    e.group.position.z = e.fromZ + (e.toZ - e.fromZ) * t
    if (e.isSpriteSheet) {
      const frame = Math.floor((elapsed / 1000) * e.frameRate) % e.frameCount
      const col = frame % e.spriteColumns
      const row = Math.floor(frame / e.spriteColumns)
      e.texture.offset.set(col / e.spriteColumns, 1 - (row + 1) / e.spriteRows)
    }
    if (elapsed >= e.fadeStartMs) {
      e.mat.opacity = e.opacity * (1 - (elapsed - e.fadeStartMs) / (e.durationMs - e.fadeStartMs))
    }
  }
}

// Tool-only extension: `impactTiming` on a `when: "impact"` soundEffect controls when
// playback starts relative to impact, based on the sound's own `duration` - "after"
// (default) starts at impact time; "before" schedules playback to *end* at impact time
// (starts immediately if travel time is shorter than the sound); "centered" lines up
// the sound's midpoint with impact time. Not part of docs/schema/sound_effect.md.
function scheduleImpactSound(effect, travelMs) {
  const durMs = (effect.duration ?? 0) * 1000
  const timing = effect.impactTiming ?? 'after'
  let atMs
  if (timing === 'before') atMs = Math.max(0, travelMs - durMs)
  else if (timing === 'centered') atMs = Math.max(0, travelMs - durMs / 2)
  else atMs = travelMs
  if (atMs <= 0) playSoundEffects([effect])
  else setTimeout(() => playSoundEffects([effect]), atMs)
}

function playSoundEffects(effects) {
  for (const effect of effects) {
    const url = resolveEffectUrl(effect.sourceURL)
    const audio = new Audio(url)
    audio.volume = Math.max(0, Math.min(1, effect.volumeScale ?? 1.0))
    audio.playbackRate = effect.pitchScale ?? 1.0
    audio.play().catch(e => logMsg(`Failed to play sound effect: ${e.message}`, true))
  }
}

loadPower() // load the prefilled example so the slider/target start in sync

// --- render loop ---

function animate(time) {
  requestAnimationFrame(animate)
  updateGraphicEffects(time)
  renderer.render(scene, camera)
}
requestAnimationFrame(animate)
</script>

</body>
